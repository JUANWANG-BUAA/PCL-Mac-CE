name: Build and release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  offline_tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Run offline regression tests (no Java or game launch)
        run: |
          xcodebuild test -project PCLMacCE.xcodeproj -scheme PCLMacCE \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:PCLMacCE.Tests/ArchitectureTests \
            -only-testing:PCLMacCE.Tests/UUIDUtilsTest \
            -only-testing:PCLMacCE.Tests/MinecraftVersionTests \
            -only-testing:PCLMacCE.Tests/ClientManifestTests \
            -only-testing:PCLMacCE.Tests/MyTaskTests \
            -only-testing:PCLMacCE.Tests/LauncherConfigPersistenceTests \
            -only-testing:PCLMacCE.Tests/ModpackPathTests \
            -only-testing:PCLMacCE.Tests/AuditRegressionTests \
            -only-testing:PCLMacCE.Tests/ResourceSearchTests

  build:
    uses: ./.github/workflows/build.yml
    with:
      build_configuration: Release
      upload_artifact: true
    secrets: inherit
  
  release:
    runs-on: macos-26
    needs: [build, offline_tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Get version
        run: |
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> $GITHUB_ENV
          VERSION_NUMBER=$(grep '^MARKETING_VERSION' Configs/Base.xcconfig | cut -d '=' -f2 | xargs)
          echo "VERSION_NUMBER=$VERSION_NUMBER" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION_NUMBER" >> $GITHUB_ENV
      
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: PCLMacCE-artifact
          path: ./artifact
          skip-decompress: true

      - name: Check release credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          SIGNING_TEAM: ${{ secrets.MACOS_SIGNING_TEAM }}
        run: |
          test -n "$NOTARY_APPLE_ID"
          test -n "$NOTARY_PASSWORD"
          test -n "$SIGNING_TEAM"
      
      - name: Notarize app
        run: |
          ditto -x -k ./artifact/PCLMacCE-artifact.zip ./artifact
          
          ditto -c -k --sequesterRsrc --keepParent ./artifact/PCLMacCE.app ./PCLMacCE.zip
          xcrun notarytool submit "./PCLMacCE.zip" \
            --apple-id "${{ secrets.MACOS_NOTARY_APPLE_ID }}" \
            --password "${{ secrets.MACOS_NOTARY_PASSWORD }}" \
            --team-id "${{ secrets.MACOS_SIGNING_TEAM }}" \
            --wait --output-format json > notary-result.json
          jq -e '.status == "Accepted"' notary-result.json
          xcrun stapler staple "./artifact/PCLMacCE.app"
          xcrun stapler validate "./artifact/PCLMacCE.app"
          codesign --verify --deep --strict --verbose=2 "./artifact/PCLMacCE.app"
      
      - name: Create DMG
        run: |
          mkdir dmg_temp

          ditto ./artifact/PCLMacCE.app dmg_temp/PCLMacCE.app
          ditto Packaging/DS_Store dmg_temp/.DS_Store
          ln -s /Applications "dmg_temp/将左边的 App 拖至此处"
          mkdir -p dmg_temp/.background
          cp Packaging/background.png dmg_temp/.background/background.png

          hdiutil create -volname "PCLMacCE" -srcfolder "dmg_temp" -ov -format UDZO "PCLMacCE-${{ env.TAG_NAME }}.dmg"
      
      - name: Process artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent ./artifact/PCLMacCE.app "./PCLMacCE-${{ env.TAG_NAME }}.zip"
          ditto -c -k --sequesterRsrc --keepParent ./artifact/build.xcarchive ./build.xcarchive.zip

      - name: Generate SHA-256 checksums
        run: |
          shasum -a 256 "PCLMacCE-${{ env.TAG_NAME }}.zip" "PCLMacCE-${{ env.TAG_NAME }}.dmg" > SHA256SUMS.txt
      
      - name: Create release
        run: |
          gh release create $TAG_NAME \
            "PCLMacCE-${{ env.TAG_NAME }}.dmg" \
            "PCLMacCE-${{ env.TAG_NAME }}.zip" \
            "build.xcarchive.zip" \
            "SHA256SUMS.txt" \
            --title $VERSION_NUMBER \
            --generate-notes \
            --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
