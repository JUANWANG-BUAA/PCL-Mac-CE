[book]
title = "PCL Mac CE 架构手册"
authors = ["JUANWANG"]
description = "PCL Mac CE 的架构、外部接口、鉴权与 Token 链路、持久化模型、风险及历史决策记录"
language = "zh"
src = "src"

[build]
build-dir = "book"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
preferred-dark-theme = "navy"
default-theme = "light"
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1
