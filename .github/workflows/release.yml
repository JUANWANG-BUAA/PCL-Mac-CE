name: Build and release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release branch and version tag
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          SIGNING_TEAM: ${{ secrets.MACOS_SIGNING_TEAM }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          test "$GITHUB_REF" = "refs/heads/dev" || { echo "Release workflow must run from dev." >&2; exit 1; }
          VERSION_NUMBER=$(grep '^MARKETING_VERSION' Configs/Base.xcconfig | cut -d '=' -f2 | xargs)
          [[ "$VERSION_NUMBER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "MARKETING_VERSION must be stable X.Y.Z." >&2; exit 1; }
          TAG_NAME="v$VERSION_NUMBER"
          EXISTING_TAGS=$(git ls-remote --tags origin "refs/tags/$TAG_NAME" "refs/tags/$TAG_NAME^{}")
          test -z "$EXISTING_TAGS" || { echo "Tag $TAG_NAME already exists; bump MARKETING_VERSION before releasing." >&2; exit 1; }
          test -n "$CERTIFICATE" || { echo "Missing MACOS_CERTIFICATE" >&2; exit 1; }
          test -n "$CERTIFICATE_PASSWORD" || { echo "Missing MACOS_CERTIFICATE_PASSWORD" >&2; exit 1; }
          test -n "$SIGNING_IDENTITY" || { echo "Missing MACOS_SIGNING_IDENTITY" >&2; exit 1; }
          test -n "$SIGNING_TEAM" || { echo "Missing MACOS_SIGNING_TEAM" >&2; exit 1; }
          test -n "$NOTARY_APPLE_ID" || { echo "Missing MACOS_NOTARY_APPLE_ID" >&2; exit 1; }
          test -n "$NOTARY_PASSWORD" || { echo "Missing MACOS_NOTARY_PASSWORD" >&2; exit 1; }

  offline_tests:
    runs-on: macos-26
    needs: preflight
    steps:
      - uses: actions/checkout@v6
      - name: Run offline regression tests (no Java or game launch)
        run: |
          xcodebuild test -project PCLMacCE.xcodeproj -scheme PCLMacCE \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:PCLMacCE.Tests/ArchitectureTests \
            -only-testing:PCLMacCE.Tests/UUIDUtilsTest \
            -only-testing:PCLMacCE.Tests/MinecraftVersionTests \
            -only-testing:PCLMacCE.Tests/ClientManifestTests \
            -only-testing:PCLMacCE.Tests/MinecraftLaunchArgumentTests \
            -only-testing:PCLMacCE.Tests/MyTaskTests \
            -only-testing:PCLMacCE.Tests/LauncherConfigPersistenceTests \
            -only-testing:PCLMacCE.Tests/ModpackPathTests \
            -only-testing:PCLMacCE.Tests/AuditRegressionTests \
            -only-testing:PCLMacCE.Tests/ResourceSearchTests \
            -only-testing:PCLMacCE.Tests/InstallationTransactionTests \
            -only-testing:PCLMacCE.Tests/ResourceHashCacheTests \
            -only-testing:PCLMacCE.Tests/FileVerificationCacheTests \
            -only-testing:PCLMacCE.Tests/UpdateModelTests \
            -only-testing:PCLMacCE.Tests/CrashAnalyzerTests \
            -only-testing:PCLMacCE.Tests/JavaCompatibilityTests \
            -only-testing:PCLMacCE.Tests/WindowSettingsTests \
            -only-testing:PCLMacCE.Tests/DownloadTests/resumesFromPersistedPartAfterInterruptedResponse

  build:
    needs: preflight
    uses: ./.github/workflows/build.yml
    with:
      build_configuration: Release
      upload_artifact: true
    secrets: inherit
  
  release:
    runs-on: macos-26
    needs: [build, offline_tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Get version
        run: |
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> $GITHUB_ENV
          VERSION_NUMBER=$(grep '^MARKETING_VERSION' Configs/Base.xcconfig | cut -d '=' -f2 | xargs)
          echo "VERSION_NUMBER=$VERSION_NUMBER" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION_NUMBER" >> $GITHUB_ENV
      
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: PCLMacCE-artifact
          path: ./artifact
          skip-decompress: true

      - name: Validate release artifact
        env:
          EXPECTED_VERSION: ${{ env.VERSION_NUMBER }}
          EXPECTED_TEAM_ID: ${{ secrets.MACOS_SIGNING_TEAM }}
        run: |
          ditto -x -k ./artifact/PCLMacCE-artifact.zip ./artifact
          APP="./artifact/PCLMacCE.app"
          test -d "$APP"
          test -d "./artifact/build.xcarchive"
          test -f "$APP/Contents/Resources/Secrets.properties"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "io.github.juanwang-buaa.pclmacce"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$EXPECTED_VERSION"
          test "$(/usr/bin/lipo -archs "$APP/Contents/MacOS/PCLMacCE")" = "arm64"
          codesign --verify --deep --strict --verbose=2 "$APP"
          TEAM_ID=$(codesign -dv --verbose=4 "$APP" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          test "$TEAM_ID" = "$EXPECTED_TEAM_ID"
          if grep -Eq '^[[:space:]]*CURSE_FORGE_API_KEY[[:space:]]*=[[:space:]]*[^#[:space:]]' "$APP/Contents/Resources/Secrets.properties"; then
            echo "A CurseForge API key must not be embedded in the distributable app." >&2
            exit 1
          fi

      - name: Notarize app
        run: |
          ditto -c -k --sequesterRsrc --keepParent ./artifact/PCLMacCE.app ./PCLMacCE.zip
          xcrun notarytool submit "./PCLMacCE.zip" \
            --apple-id "${{ secrets.MACOS_NOTARY_APPLE_ID }}" \
            --password "${{ secrets.MACOS_NOTARY_PASSWORD }}" \
            --team-id "${{ secrets.MACOS_SIGNING_TEAM }}" \
            --wait --output-format json > notary-result.json
          jq -e '.status == "Accepted"' notary-result.json
          xcrun stapler staple "./artifact/PCLMacCE.app"
          xcrun stapler validate "./artifact/PCLMacCE.app"
          codesign --verify --deep --strict --verbose=2 "./artifact/PCLMacCE.app"
      
      - name: Create DMG
        run: |
          mkdir dmg_temp

          ditto ./artifact/PCLMacCE.app dmg_temp/PCLMacCE.app
          ditto Packaging/DS_Store dmg_temp/.DS_Store
          ln -s /Applications "dmg_temp/将左边的 App 拖至此处"
          mkdir -p dmg_temp/.background
          cp Packaging/background.png dmg_temp/.background/background.png

          hdiutil create -volname "PCLMacCE" -srcfolder "dmg_temp" -ov -format UDZO "PCLMacCE-${{ env.TAG_NAME }}.dmg"
      
      - name: Process artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent ./artifact/PCLMacCE.app "./PCLMacCE-${{ env.TAG_NAME }}.zip"
          ditto -c -k --sequesterRsrc --keepParent ./artifact/build.xcarchive ./build.xcarchive.zip

      - name: Generate SHA-256 checksums
        run: |
          shasum -a 256 "PCLMacCE-${{ env.TAG_NAME }}.zip" "PCLMacCE-${{ env.TAG_NAME }}.dmg" > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt
          hdiutil verify "PCLMacCE-${{ env.TAG_NAME }}.dmg"
          ZIP_ENTRIES=$(unzip -Z1 "PCLMacCE-${{ env.TAG_NAME }}.zip")
          [[ "$ZIP_ENTRIES" == *"PCLMacCE.app/Contents/Info.plist"* ]]
          [[ "$ZIP_ENTRIES" != *"PCLMacCE-artifact/"* ]]
      
      - name: Create release
        run: |
          gh release create $TAG_NAME \
            "PCLMacCE-${{ env.TAG_NAME }}.dmg" \
            "PCLMacCE-${{ env.TAG_NAME }}.zip" \
            "build.xcarchive.zip" \
            "SHA256SUMS.txt" \
            --title $VERSION_NUMBER \
            --generate-notes \
            --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
