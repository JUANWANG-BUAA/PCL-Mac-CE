# Secrets template for local development.
# CI may generate/overwrite this file during build or release.
# Do not commit real credentials to the repository.
#
# To configure locally, uncomment and set the required keys below:

# CURSE_FORGE_API_KEY=your-key-here

# 微软登录的自有 Entra 应用 client ID（可选）。未配置时使用 Prism Launcher 的
# 公共 ID（MicrosoftAuthService.defaultClientID，见 docs-book ADR-010）。
# CI 亦可用环境变量 PCLMAC_MS_CLIENT_ID 注入。
# MS_CLIENT_ID=your-entra-app-client-id-here
