<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#236f9c"/>
      <stop offset="1" stop-color="#10436b"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="24" y="24" width="976" height="976" rx="210"/>
    </clipPath>
    <linearGradient id="grass" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#83df83"/>
      <stop offset="1" stop-color="#55bd70"/>
    </linearGradient>
    <linearGradient id="left-face" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3a91bd"/>
      <stop offset="1" stop-color="#2375a5"/>
    </linearGradient>
    <linearGradient id="right-face" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b638f"/>
      <stop offset="1" stop-color="#124c78"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#background)"/>

    <!-- 草地方块提供 Minecraft 识别线索，并适配小尺寸显示。 -->
    <path d="M236 278 326 198 818 228 728 308 236 278Z" fill="url(#grass)"/>
    <path d="M728 308 818 228V708L728 798V308Z" fill="url(#right-face)"/>
    <path d="M236 278 728 308V798L236 768V278Z" fill="url(#left-face)"/>
    <path d="M236 278 728 308V400L236 370V278Z" fill="url(#grass)"/>

    <!-- 正向的 P 字母在程序坞与启动台的小尺寸下仍清晰可辨。 -->
    <path fill="#f7fbff" fill-rule="evenodd" d="M365 424h148c95 0 150 47 150 124s-55 124-150 124h-47v80H365V424Zm101 74v100h44c37 0 53-16 53-50s-16-50-53-50h-44Z"/>

    <!-- CE 标记明确区分社区版，避免只显示 P 时与旧项目图标混淆。 -->
    <g transform="rotate(8 830 816)">
      <rect x="724" y="754" width="214" height="124" rx="48" fill="#effff8" stroke="#124c78" stroke-width="12"/>
      <text x="831" y="842" fill="#124c78" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" text-anchor="middle">CE</text>
    </g>
  </g>
</svg>
